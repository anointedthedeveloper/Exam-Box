name: Build ExamBox.exe

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/ExamBox.Tests
      - name: Publish self-contained exe
        run: dotnet publish src/ExamBox.Admin -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: ExamBox-win-x64
          path: dist/ExamBox.exe
          if-no-files-found: error
